<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Perbandingan Berbalik Nilai</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1d2740;--mu:#5d6b8a;--pr:#5b4bdb;--ac:#ff8a3d;--ok:#16a34a;--no:#dc2626;--bd:#e1e7f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12172b;--card:#1c2340;--tx:#eef1ff;--mu:#a0abcc;--bd:#2d3659;--pr:#8b7fff}}
:root[data-theme="dark"]{--bg:#12172b;--card:#1c2340;--tx:#eef1ff;--mu:#a0abcc;--bd:#2d3659;--pr:#8b7fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#5b4bdb,#8a5cf6 60%,#ff8a3d);color:#fff;padding:14px 16px 10px}
header h1{margin:0;font-size:1.15rem}header small{opacity:.9}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:4px;overflow-x:auto;padding:6px}
nav button{flex:0 0 auto;border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:10px;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:64px}
nav button span{font-size:1.25rem}nav button.on{background:var(--pr);color:#fff}nav button.dn::after{content:"✓";color:var(--ok);font-weight:700}nav button.on.dn::after{color:#fff}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}
h2{margin:.2em 0 .5em;font-size:1.3rem}h3{margin:.3em 0}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:1rem;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:var(--ac)}.btn.ghost{background:none;color:var(--pr);border:2px solid var(--pr)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:1rem;cursor:pointer}
.opt:hover{border-color:var(--pr)}.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.no{border-color:var(--no);background:#dc262622}
input[type=text],input[type=number],textarea{width:100%;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input.sm{width:90px;display:inline-block;text-align:center}
.fb{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--pr)}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;cursor:pointer;color:var(--tx)}
.tile .e{font-size:2rem}
table{border-collapse:collapse;width:100%;text-align:center}td,th{border:1px solid var(--bd);padding:8px}th{background:var(--bg)}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));transition:width .5s}
.formula{font-size:1.2rem;text-align:center;background:var(--bg);padding:12px;border-radius:12px;font-weight:700;color:var(--pr)}
.work{font-size:1.6rem;letter-spacing:2px;min-height:2.2em;word-break:break-all}
.badge{opacity:.3;filter:grayscale(1)}.badge.got{opacity:1;filter:none}
.cert{border:6px double var(--pr);text-align:center;padding:24px;border-radius:12px;background:var(--card)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}.pop{animation:pop .4s}
.bounce{display:inline-block;animation:pop .5s}
@media print{header,nav,.noprint{display:none}body{background:#fff}}
</style></head><body>
<header><h1>🚀 Petualangan Perbandingan Berbalik Nilai</h1><small>Matematika • Kelas 7 • Fase D • Kurikulum Merdeka</small></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const P=[['home','🏠','Beranda'],['tujuan','🎯','Tujuan'],['materi','📖','Materi'],['eksplor','🔍','Eksplorasi'],['lab','🧪','Lab Maya'],['game','🎮','Mini Game'],['lkpd','📝','Lembar Kerja'],['kuis','🧩','Kuis'],['progres','📊','Progres'],['refleksi','💡','Refleksi'],['badge','🏆','Badge']];
const MOD=['materi','eksplor','lab','game','lkpd','kuis','refleksi'];
const BG={materi:['📖','Pemikir Konsep'],eksplor:['🔍','Detektif Pola'],lab:['🧪','Ilmuwan Maya'],game:['🎮','Jagoan Game'],lkpd:['📝','Pemecah Masalah'],kuis:['🧩','Bintang Kuis'],refleksi:['💡','Pembelajar Reflektif']};
let S={done:{},name:'',post:[],ref:''},cur='home';
try{const t=localStorage.getItem('pbn');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem('pbn',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const num=v=>parseFloat(String(v).replace(',','.'));
function done(k,sc){if(!S.done[k]||sc>S.done[k])S.done[k]=sc||1;save();nav()}
function nav(){$('#nav').innerHTML=P.map(p=>`<button class="${cur==p[0]?'on':''} ${S.done[p[0]]?'dn':''}" onclick="go('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join('')}
function go(p){cur=p;nav();R[p]();window.scrollTo(0,0)}
const view=h=>$('#main').innerHTML=h;
const next=(p,l)=>`<button class="btn alt" onclick="go('${p}')">${l||'Lanjut'} ➜</button>`;
const R={};

R.home=()=>view(`<div class="card"><div style="font-size:3rem" class="bounce">👷‍♂️⏳🚗</div>
<h2>Halo, Petualang Matematika!</h2>
<p><b>Apersepsi:</b> Pernahkah kamu kerja bakti membersihkan kelas? Kalau yang membantu <b>makin banyak</b>, pekerjaan selesai <b>makin cepat</b>. Naik motor lebih ngebut, sampai tujuan <b>makin cepat</b> juga. Dua hal itu berubah <i>berlawanan arah</i> — inilah <b>perbandingan berbalik nilai</b>!</p>
<p>Siapa namamu?</p><input type="text" id="nm" placeholder="Tulis namamu" value="${S.name}" oninput="S.name=this.value;save()">
<p style="margin-top:12px"><button class="btn" onclick="go('tujuan')">Mulai Petualangan 🚀</button></p></div>
<div class="card"><h3>Alur belajar</h3><p>📖 Materi → 🔍 Eksplorasi → 🧪 Lab Maya → 🎮 Game → 📝 Lembar Kerja &amp; Diskusi → 🧩 Kuis Adaptif → 💡 Refleksi → 🏆 Sertifikat</p></div>`);

R.tujuan=()=>view(`<div class="card"><h2>🎯 Tujuan Pembelajaran</h2>
<p>Setelah belajar, kamu mampu:</p>
<div class="fb">1️⃣ Menganalisis konsep perbandingan berbalik nilai melalui penyelesaian masalah kontekstual secara tepat melalui media interaktif daring.</div><br>
<div class="fb">2️⃣ Memecahkan masalah kontekstual yang melibatkan perbandingan berbalik nilai secara kolaboratif melalui diskusi pada ruang virtual.</div>
<p><b>Kriteria keberhasilan:</b> kamu bisa menjelaskan ciri berbalik nilai, menghitung dengan rumus hasil kali tetap, dan memberi alasan jawabanmu kepada temanmu.</p>${next('materi')}</div>`);

let mi=0;
const MS=[
()=>`<h3>1. Apa itu berbalik nilai?</h3><p>Dua besaran disebut <b>berbalik nilai</b> jika satu besaran <b>naik</b>, besaran lainnya <b>turun</b> dengan perbandingan terbalik.</p>
<p>Contoh: pekerja ↑ ➜ lama kerja ↓. Kalau pekerja jadi <b>2 kali</b>, waktu menjadi <b>½ kalinya</b>.</p>
<p style="font-size:2rem;text-align:center">👷 ×2 ➜ ⏱️ ÷2</p>`,
()=>`<h3>2. Rumus kunci</h3><div class="formula">x₁ × y₁ = x₂ × y₂ = k (tetap)</div>
<p>Kalau <b>berbanding lurus</b>, yang tetap adalah <b>hasil bagi</b> (y/x). Kalau <b>berbalik nilai</b>, yang tetap adalah <b>hasil kali</b> (x·y).</p>
<p>💡 Trik: tanya dirimu, <i>“Kalau yang satu bertambah, yang lain bertambah atau berkurang?”</i> Berkurang ➜ berbalik nilai.</p>`,
()=>`<h3>3. Contoh soal bertahap</h3><p>6 pekerja menyelesaikan bangunan dalam 12 hari. Berapa hari jika 8 pekerja?</p>
<button class="btn ghost" onclick="rv(this)" data-t="Langkah 1: Naik/turun? Pekerja bertambah ➜ hari berkurang ➜ <b>berbalik nilai</b>.">Langkah 1</button>
<button class="btn ghost" onclick="rv(this)" data-t="Langkah 2: 6 × 12 = 8 × y ➜ 72 = 8y">Langkah 2</button>
<button class="btn ghost" onclick="rv(this)" data-t="Langkah 3: y = 72 ÷ 8 = <b>9 hari</b>. Masuk akal: pekerja lebih banyak, hari lebih sedikit ✅">Langkah 3</button><div id="rvb"></div>`];
function rv(b){$('#rvb').innerHTML+=`<div class="fb pop">${b.dataset.t}</div>`;b.disabled=true}
R.materi=()=>{view(`<div class="card"><h2>📖 Materi Interaktif</h2><div class="bar"><i style="width:${(mi+1)/MS.length*100}%"></i></div><br>${MS[mi]()}
<p>${mi>0?'<button class="btn ghost" onclick="mi--;R.materi()">⬅ Kembali</button>':''}${mi<MS.length-1?'<button class="btn" onclick="mi++;R.materi()">Berikutnya ➜</button>':'<button class="btn alt" onclick="done(\'materi\',100);go(\'eksplor\')">Selesai, ke Eksplorasi ➜</button>'}</p></div>`)};

R.eksplor=()=>{const v=[20,30,40,60],t=[3,2,1.5,1];
view(`<div class="card"><h2>🔍 Aktivitas Eksplorasi</h2><p>Ayah pergi ke kota sejauh <b>60 km</b>. Isi tabel waktu tempuh, lalu hitung hasil kali kecepatan × waktu!</p>
<table><tr><th>Kecepatan (km/jam)</th>${v.map(x=>`<td>${x}</td>`).join('')}</tr>
<tr><th>Waktu (jam)</th>${v.map((x,i)=>`<td>${i<2?t[i]:`<input class="sm" type="text" id="e${i}" inputmode="decimal">`}</td>`).join('')}</tr>
<tr><th>Kecepatan × Waktu</th>${v.map((x,i)=>`<td>${i<2?x*t[i]:'?'}</td>`).join('')}</tr></table>
<p><button class="btn" onclick="chkE()">Periksa</button></p><div id="ef"></div><hr>
<p><b>Simpulan:</b> Saat kecepatan naik, waktu <select id="s1"><option>…</option><option>naik</option><option>turun</option></select>, dan hasil kali keduanya selalu <select id="s2"><option>…</option><option>berubah-ubah</option><option>tetap</option></select>.</p>
<button class="btn alt" onclick="chkS()">Cek Simpulan</button><div id="sf"></div></div>`)};
function chkE(){const a=num($('#e2').value),b=num($('#e3').value),ok=a==1.5&&b==1;
$('#ef').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Tepat! 60÷40 = 1,5 dan 60÷60 = 1. Semua hasil kali = 60 km (jarak tetap).':'❌ Ingat: waktu = jarak ÷ kecepatan = 60 ÷ kecepatan.'}</div>`}
function chkS(){const ok=$('#s1').value=='turun'&&$('#s2').value=='tetap';$('#sf').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'🎉 Benar! Itulah ciri perbandingan berbalik nilai.'+next('lab','Ke Lab Maya'):'Coba amati lagi tabelnya.'}</div>`;if(ok)done('eksplor',100)}

R.lab=()=>{view(`<div class="card"><h2>🧪 Laboratorium Maya: Kerja Bakti</h2><p>Mengecat pagar sekolah butuh <b>72 hari-orang</b> (6 pekerja × 12 hari). Geser jumlah pekerja dan amati!</p>
<p>Pekerja: <b id="lw">6</b> <input type="range" id="sl" min="1" max="24" value="6" oninput="labU()" style="width:100%"></p>
<div class="work" id="wk"></div><div class="formula" id="lf"></div>
<svg viewBox="0 0 300 180" style="width:100%;max-width:420px;display:block;margin:auto"><g id="gr"></g></svg>
<p style="text-align:center;color:var(--mu)">Grafik berbalik nilai berbentuk lengkung (hiperbola), bukan garis lurus.</p>
<p><b>Tantangan:</b> Berapa pekerja agar selesai tepat <b>4 hari</b>?  <input class="sm" type="number" id="lc"> <button class="btn" onclick="labC()">Cek</button></p><div id="lfb"></div></div>`);labU()};
function labU(){const n=+$('#sl').value,d=72/n;$('#lw').textContent=n;
$('#wk').innerHTML='👷'.repeat(n);
$('#lf').innerHTML=`${n} × ${+d.toFixed(2)} = 72 ➜ selesai dalam <b>${+d.toFixed(2)} hari</b>`;
let g='<line x1="30" y1="150" x2="290" y2="150" stroke="gray"/><line x1="30" y1="10" x2="30" y2="150" stroke="gray"/><text x="150" y="172" font-size="10" fill="gray">pekerja</text><text x="2" y="12" font-size="10" fill="gray">hari</text><polyline fill="none" stroke="#5b4bdb" stroke-width="2.5" points="';
for(let i=3;i<=24;i+=.5)g+=`${30+i*10.8},${150-Math.min(72/i,60)*2.2} `;
g+=`"/><circle cx="${30+n*10.8}" cy="${150-Math.min(d,60)*2.2}" r="6" fill="#ff8a3d"/>`;$('#gr').innerHTML=g}
function labC(){const ok=num($('#lc').value)==18;$('#lfb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Benar! 72 ÷ 4 = 18 pekerja.'+next('game','Ke Mini Game'):'❌ Gunakan hasil kali tetap: n × 4 = 72.'}</div>`;if(ok)done('lab',100)}

const GQ=[['Banyak buku & total harga (harga satuan tetap)','L'],['Kecepatan & waktu tempuh (jarak tetap)','B'],['Banyak pekerja & lama pekerjaan','B'],['Jumlah liter bensin & jarak tempuh','L'],['Banyak anak & jatah permen tiap anak (total permen tetap)','B'],['Jumlah keran & waktu mengisi bak','B'],['Banyak pensil & uang yang dibayar','L'],['Jumlah porsi & banyak beras yang dimasak','L']];
let gi=0,gs=0;
R.game=()=>{gi=0;gs=0;gq()};
function gq(){if(gi>=GQ.length){const sc=Math.round(gs/GQ.length*100);done('game',sc);return view(`<div class="card"><h2>🎮 Selesai!</h2><p style="font-size:2rem">Skor: ${gs}/${GQ.length}</p>${next('lkpd','Ke Lembar Kerja')}</div>`)}
view(`<div class="card"><h2>🎮 Lurus atau Berbalik?</h2><p>Soal ${gi+1}/${GQ.length} • Skor ${gs}</p><div class="tile" style="margin:12px 0"><div class="e">🤔</div><b>${GQ[gi][0]}</b></div>
<div class="grid"><button class="btn" onclick="ga('L')">📈 Berbanding Lurus</button><button class="btn alt" onclick="ga('B')">🔄 Berbalik Nilai</button></div><div id="gf"></div></div>`)}
function ga(a){const ok=a==GQ[gi][1];if(ok)gs++;gi++;$('#gf').innerHTML=`<div class="fb ${ok?'ok':'no'} pop">${ok?'✅ Benar!':'❌ Kurang tepat.'} ${GQ[gi-1][1]=='B'?'Satu naik, yang lain turun (hasil kali tetap).':'Keduanya naik bersama (hasil bagi tetap).'}</div><button class="btn" onclick="gq()">Lanjut ➜</button>`;document.querySelectorAll('#main .grid button').forEach(b=>b.disabled=true)}

const LK=[['8 pekerja menyelesaikan pekerjaan dalam 15 hari. Berapa hari jika dikerjakan 10 pekerja?',12,'8 × 15 = 120; 120 ÷ 10 = 12 hari','Hari'],['Mobil melaju 80 km/jam selama 3 jam. Jika kecepatan 60 km/jam, berapa jam waktu tempuhnya?',4,'80 × 3 = 240; 240 ÷ 60 = 4 jam','Jam'],['Beras asrama cukup untuk 40 siswa selama 18 hari. Jika siswa menjadi 60, cukup untuk berapa hari?',12,'40 × 18 = 720; 720 ÷ 60 = 12 hari','Hari']];
R.lkpd=()=>{view(`<div class="card"><h2>📝 Lembar Kerja Interaktif</h2><p>Kerjakan dengan langkah: ① tentukan jenis hubungan ② tulis hasil kali tetap ③ hitung.</p>
${LK.map((q,i)=>`<div class="fb"><b>${i+1}.</b> ${q[0]}<br><br>${q[3]}: <input class="sm" type="number" id="k${i}"> <button class="btn" onclick="ck(${i})">Periksa</button> <button class="btn ghost" onclick="$('#kh${i}').innerHTML='💡 Pekerja/kecepatan/siswa naik ➜ waktu turun. Cari hasil kali tetapnya dulu.'">Petunjuk</button><div id="kh${i}"></div><div id="kf${i}"></div></div><br>`).join('')}</div>
<div class="card"><h3>💬 Ruang Diskusi Virtual</h3><p>Buat <b>satu soal berbalik nilai</b> dari kehidupanmu, lalu <b>tanggapi</b> soal temanmu: apakah benar berbalik nilai? Berikan alasan!</p>
<textarea id="dp" rows="3" placeholder="Tulis soal / tanggapanmu…"></textarea><button class="btn" onclick="dpost()">Kirim 💬</button>
<div id="dl"></div><p style="color:var(--mu);font-size:.85rem">Catatan: tampilkan ruang ini bersama kelompokmu (layar bersama/ video call) agar bisa saling menanggapi.</p></div>`);dl()};
function ck(i){const ok=num($('#k'+i).value)==LK[i][1];$('#kf'+i).innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Benar! ':'❌ Belum tepat. '}Penyelesaian: ${LK[i][2]}</div>`;if(ok){S.lk=S.lk||{};S.lk[i]=1;save();if(Object.keys(S.lk).length>=3&&S.post.length)done('lkpd',100)}}
function dpost(){const v=$('#dp').value.trim();if(!v)return;S.post.push((S.name||'Aku')+': '+v);save();$('#dp').value='';dl();if(S.lk&&Object.keys(S.lk).length>=3)done('lkpd',100)}
function dl(){$('#dl').innerHTML=S.post.map(p=>`<div class="fb">${p.replace(/</g,'&lt;')}</div>`).join('')}

const QB=[[1,'Manakah yang berbalik nilai?',['Banyak barang & harga total','Kecepatan & waktu (jarak tetap)','Tinggi & usia','Sisi & luas persegi'],1,'Jarak tetap: kecepatan naik ➜ waktu turun.'],
[1,'4 pekerja selesai dalam 15 hari. Jika 6 pekerja, berapa hari?',['10','22,5','9','12'],0,'4×15=60; 60÷6=10 hari.'],
[1,'Jika x menjadi 2 kali pada berbalik nilai, maka y menjadi…',['2 kali','½ kali','tetap','4 kali'],1,'Hasil kali tetap, jadi y menjadi setengahnya.'],
[2,'Motor 40 km/jam menempuh 3 jam. Dengan 60 km/jam, waktunya…',['2 jam','4,5 jam','1,5 jam','3 jam'],0,'40×3=120; 120÷60=2 jam.'],
[2,'Makanan 20 ayam cukup 12 hari. Ditambah 10 ayam, cukup berapa hari?',['18','8','6','10'],1,'20×12=240; 240÷30=8 hari.'],
[2,'3 pompa mengisi tangki 8 jam. Dengan 2 pompa (sama), waktunya…',['5⅓ jam','12 jam','16 jam','6 jam'],1,'3×8=24; 24÷2=12 jam.'],
[3,'10 pekerja butuh 24 hari. Setelah 6 hari, ditambah 5 pekerja. Sisa waktu hingga selesai…',['18 hari','12 hari','9 hari','10 hari'],1,'Total 240 hari-orang; terpakai 60; sisa 180; 180÷15=12 hari.'],
[3,'24 anak mendapat 5 potong roti. Jika jadi 30 anak (roti tetap), tiap anak mendapat…',['6','5','4','3'],2,'24×5=120; 120÷30=4 potong.'],
[3,'Tabel berbalik nilai: x = 3, 4, 6 dan y = 12, 9, … Nilai y terakhir?',['8','6','4','3'],1,'3×12=36; 36÷6=6.']];
let Q;
R.kuis=()=>{Q={lv:1,n:0,sc:0,used:[]};qq()};
function qq(){if(Q.n>=6){const sc=Math.round(Q.sc/6*100);done('kuis',sc);return view(`<div class="card"><h2>🧩 Hasil Kuis</h2><p style="font-size:2.2rem">Skor: ${sc}</p><p>Level akhir: ${'⭐'.repeat(Q.lv)}</p><p>${sc>=80?'Luar biasa! 🎉':sc>=50?'Bagus, terus berlatih! 💪':'Jangan menyerah, ulangi Materi dan Lab Maya ya 🤗'}</p><button class="btn ghost" onclick="R.kuis()">Ulangi</button>${next('refleksi','Ke Refleksi')}</div>`)}
let c=QB.map((q,i)=>i).filter(i=>!Q.used.includes(i)&&QB[i][0]==Q.lv);if(!c.length)c=QB.map((q,i)=>i).filter(i=>!Q.used.includes(i));Q.i=c[Math.floor(Math.random()*c.length)];Q.used.push(Q.i);const q=QB[Q.i];
view(`<div class="card"><h2>🧩 Kuis Adaptif</h2><p>Soal ${Q.n+1}/6 • Level ${'⭐'.repeat(Q.lv)} <small>(naik jika benar, turun jika salah)</small></p><h3>${q[1]}</h3>${q[2].map((o,j)=>`<button class="opt" onclick="qa(${j},this)">${'ABCD'[j]}. ${o}</button>`).join('')}<div id="qf"></div></div>`)}
function qa(j,b){const q=QB[Q.i],ok=j==q[3];document.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k==q[3])x.classList.add('ok')});if(!ok)b.classList.add('no');
if(ok){Q.sc++;Q.lv=Math.min(3,Q.lv+1)}else Q.lv=Math.max(1,Q.lv-1);Q.n++;
$('#qf').innerHTML=`<div class="fb ${ok?'ok':'no'} pop">${ok?'✅ Tepat!':'❌ Belum tepat.'} ${q[4]}</div><button class="btn" onclick="qq()">Lanjut ➜</button>`}

R.progres=()=>{const n=MOD.filter(m=>S.done[m]).length;view(`<div class="card"><h2>📊 Progres Belajar</h2><p>${S.name||'Kamu'} telah menyelesaikan <b>${n}/${MOD.length}</b> kegiatan.</p><div class="bar"><i style="width:${n/MOD.length*100}%"></i></div></div>
<div class="card">${MOD.map(m=>`<p>${BG[m][0]} ${P.find(p=>p[0]==m)[2]} — ${S.done[m]?'✅ '+(['game','kuis'].includes(m)?'skor '+S.done[m]:'selesai'):'⏳ belum'}</p>`).join('')}</div>`)};

R.refleksi=()=>view(`<div class="card"><h2>💡 Refleksi</h2><p>Seberapa paham kamu tentang berbalik nilai?</p>
<div class="grid">${['😕 Belum paham','🙂 Cukup paham','🤩 Sangat paham'].map(t=>`<button class="tile" onclick="S.lvl='${t}';this.style.borderColor='var(--pr)'">${t}</button>`).join('')}</div>
<p>1. Apa ciri utama perbandingan berbalik nilai?</p><textarea id="r1" rows="2">${S.ref}</textarea>
<p>2. Contoh berbalik nilai di sekitarmu, dan bagian yang masih membingungkan?</p><textarea id="r2" rows="2"></textarea>
<p><button class="btn alt" onclick="if($('#r1').value.trim()){S.ref=$('#r1').value;done('refleksi',100);go('badge')}else alert('Isi jawaban 1 dulu ya')">Simpan Refleksi</button></p></div>`);

R.badge=()=>{const all=MOD.every(m=>S.done[m]);view(`<div class="card"><h2>🏆 Badge &amp; Sertifikat</h2><div class="grid">${MOD.map(m=>`<div class="tile badge ${S.done[m]?'got pop':''}"><div class="e">${BG[m][0]}</div><small>${BG[m][1]}</small></div>`).join('')}</div></div>
${all?`<div class="cert"><div style="font-size:3rem">🎓</div><h2>SERTIFIKAT</h2><p>diberikan kepada</p><h1 style="color:var(--pr)">${S.name||'Siswa Hebat'}</h1><p>atas keberhasilan menyelesaikan pembelajaran<br><b>Perbandingan Berbalik Nilai</b><br>Matematika Kelas 7 • Kurikulum Merdeka</p><p>Skor Kuis: ${S.done.kuis} • Skor Game: ${S.done.game}</p><button class="btn noprint" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div>`:'<div class="card">🔒 Selesaikan semua kegiatan untuk membuka sertifikat.</div>'}`)};
nav();R.home();
</script></body></html>
